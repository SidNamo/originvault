map $http_x_forwarded_proto $originvault_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  access_log off;
  # Streaming endpoints enforce MAX_UPLOAD_BYTES in the backend.
  client_max_body_size 0;
  root /usr/share/nginx/html;
  index index.html;
  add_header Referrer-Policy "no-referrer" always;

  location = /webdav {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $originvault_forwarded_proto;
  }

  location ^~ /webdav/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $originvault_forwarded_proto;
  }

  location ~ ^/dav(?:/|$) {
    return 404;
  }

  location ^~ /api/public/shares/ {
    access_log off;
    proxy_pass http://backend:4000;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $originvault_forwarded_proto;
  }

  location /api/ {
    proxy_pass http://backend:4000/api/;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $originvault_forwarded_proto;
  }

  location ^~ /s/ {
    access_log off;
    try_files $uri /index.html;
  }

  location / {
    try_files $uri /index.html;
  }
}
