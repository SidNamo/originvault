map $http_x_forwarded_proto $originvault_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
    listen 80;
    server_tokens off;
    access_log off;
    client_max_body_size 10g;
    client_body_timeout 60s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 60s;
    root /usr/share/nginx/html;
    index index.html;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;

  location = /webdav {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $originvault_forwarded_proto;
  }

  location ^~ /webdav/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $originvault_forwarded_proto;
  }

  location ~ ^/dav(?:/|$) {
    return 404;
  }

  location ^~ /api/public/shares/ {
    access_log off;
    proxy_pass http://backend:4000;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $originvault_forwarded_proto;
  }

  location /api/ {
    proxy_pass http://backend:4000/api/;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $originvault_forwarded_proto;
  }

  location ^~ /s/ {
    access_log off;
    try_files $uri /index.html;
  }

  location / {
    try_files $uri /index.html;
  }
}
