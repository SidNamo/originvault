map $http_x_forwarded_proto $originvault_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $uri $originvault_frame_options {
  default "DENY";
  ~^/api/previews/ "SAMEORIGIN";
  ~^/api/public/shares/[^/]+/files/[^/]+/preview$ "SAMEORIGIN";
}

map $uri $originvault_content_security_policy {
  default "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:";
  ~^/api/previews/ "frame-ancestors 'self'";
  ~^/api/public/shares/[^/]+/files/[^/]+/preview$ "frame-ancestors 'self'";
}

upstream originvault_backend {
  server backend:4000;
}

map $uri $originvault_log_path {
  default $uri;
  ~^/api/public/shares/ /api/public/shares/[REDACTED];
  ~^/api/previews/ /api/previews/[REDACTED];
  ~^/s/ /s/[REDACTED];
}

map "$uri:$status" $originvault_log_request {
  default 0;
  ~^/webdav(?:/|:) 1;
  ~:[45][0-9][0-9]$ 1;
}

log_format originvault_request escape=json
  '{"time":"$time_iso8601","event":"proxy_request_completed","requestId":"$request_id",'
  '"method":"$request_method","path":"$originvault_log_path","status":$status,'
  '"requestBytes":$request_length,"responseBytes":$body_bytes_sent,"durationSeconds":$request_time,'
  '"upstreamStatus":"$upstream_status","upstreamSeconds":"$upstream_response_time"}';

server {
    listen 80;
    server_tokens off;
    access_log /dev/stdout originvault_request if=$originvault_log_request;
    error_log /dev/stderr warn;
    # The backend applies the configured per-file limit, including chunked PUTs.
    # Multipart envelopes must not make a file at that limit fail at the proxy.
    client_max_body_size 0;
    client_body_timeout 60s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 60s;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css;
    root /usr/share/nginx/html;
    index index.html;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options $originvault_frame_options always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy $originvault_content_security_policy always;

  location = /webdav {
    proxy_pass http://originvault_backend;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header X-Request-ID $request_id;
    client_body_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_socket_keepalive on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $originvault_forwarded_proto;
  }

  location ^~ /webdav/ {
    proxy_pass http://originvault_backend;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header X-Request-ID $request_id;
    client_body_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_socket_keepalive on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $originvault_forwarded_proto;
  }

  location ~ ^/dav(?:/|$) {
    return 404;
  }

  location ^~ /api/public/shares/ {
    proxy_pass http://originvault_backend;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header X-Request-ID $request_id;
    client_body_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $originvault_forwarded_proto;
  }

  location /api/ {
    proxy_pass http://originvault_backend/api/;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header X-Request-ID $request_id;
    client_body_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $originvault_forwarded_proto;
  }

  location ^~ /s/ {
    try_files $uri /index.html;
  }

  location = / {
    absolute_redirect off;
    return 302 /files$is_args$args;
  }

  location / {
    try_files $uri /index.html;
  }
}
